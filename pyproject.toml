[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-analytics"
version = "0.5.2"
description = "Analytics: event registry, ingest, funnels and adapter fan-out for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "stapel-core>=0.54.1,<1.0",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-analytics"
Repository = "https://github.com/usestapel/stapel-analytics"
Documentation = "https://github.com/usestapel/stapel-analytics#readme"
Changelog = "https://github.com/usestapel/stapel-analytics/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-analytics/issues"

[project.optional-dependencies]
# The Google Ads SDK, for `analytics.upload_click_conversion` /
# `manage.py analytics_upload_conversions` (MODULE.md §8). Optional because
# it carries a protobuf runtime and a grpc stack: a library that made every
# host install that to import `stapel_analytics.models` is a library nobody
# mounts. `conversions.py` imports it inside one function, so everything
# above that seam works without it.
google-ads = ["google-ads>=25.0"]
# celery is optional at runtime (tasks.py degrades to plain callables), but
# NOT optional for the test job: the beat-schedule tests skip without it,
# and a skipped test is a gate nobody notices going quiet.
#
# `all` is deliberately NOT `google-ads + celery`. The reason `all` exists
# is the CI install step, which pulls it so no test fails at collection on
# a missing import — and the conversion tests stub the client at
# `conversions._client_class` precisely so the suite proves the mapping
# WITHOUT the SDK. Putting google-ads in `all` would add a grpc build to
# every CI matrix leg to test code that never calls it.
all = ["celery>=5.3"]

[tool.setuptools]
package-dir = {"stapel_analytics" = "."}
# `management` and `management.commands` are packages, not package-data: a
# directory of .py files that is not listed here is simply absent from the
# wheel, and a management command absent from the wheel is one that works
# for every developer running from a checkout and for nobody running from
# an install. Nothing warns; `manage.py purge_analytics` just says
# "Unknown command".
packages = [
    "stapel_analytics",
    "stapel_analytics.management",
    "stapel_analytics.management.commands",
    "stapel_analytics.migrations",
]

[tool.setuptools.package-data]
# The contract documents ship IN THE WHEEL: that is what makes
# `stapel-catalog --from-installed` possible, i.e. what turns catalog
# freshness from somebody's discipline into a property of the lockfile.
# A module that keeps them repo-only publishes code an agent cannot read.
# Every pattern below matches real files in the tree: a package-data entry
# matching nothing is a wheel that silently ships less than the repo.
# docs/errors.json is the one contract artifact emitted so far (gated by
# tests/test_error_keys.py); schema/flows/capabilities are not — MODULE.md
# §10 — so their patterns are absent rather than dead.
stapel_analytics = [
    "py.typed",
    "CONFIG.MD",
    "MODULE.md",
    "migrations/*.py",
    "schemas/**/*.json",
    "translations/*.json",
    "docs/errors.json",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
    # Harness entry point, same class as conftest.py: it exists so
    # makemigrations/check run against the single settings block the suite
    # uses, and it is exercised by running them, not by importing it.
    "manage.py",
]
